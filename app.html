<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نصب تخصص‌یاب</title>
<style>
body{margin:0;background:#0f1720;color:#e7edf3;font-family:Tahoma,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#229ED9,#1565a8);border-radius:18px;padding:18px;text-align:center}
img.logo{width:96px;height:96px;border-radius:20px;object-fit:cover}
a.btn{display:block;text-align:center;background:#229ED9;color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:700;margin:12px 0}
.card{background:#17212b;border-radius:16px;padding:14px;margin-top:12px}
.step{font-size:18px;line-height:1.7}
img.shot{width:100%;border-radius:12px;margin-top:8px}
b{color:#ffd56a}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img class="logo" src="logo.jpg" alt="تخصص‌یاب">
    <h1>تخصص‌یاب</h1>
    <p>ثبت آگهی استخدام و رزومه</p>
  </header>
  <a class="btn" href="takhassosyab.apk">دانلود برنامه</a>
  <section class="card">
    <p class="step">۱. بعد از دانلود، اگر فقط دکمه OK دیدی، <b>More details</b> را بزن.</p>
    <img class="shot" src="play-1.jpg" alt="More details">
    <p class="step">۲. بعد <b>Install anyway</b> را بزن. OK را نزن.</p>
    <img class="shot" src="play-2.jpg" alt="Install anyway">
  </section>
</div>
</body>
</html>
