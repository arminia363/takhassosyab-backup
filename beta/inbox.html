<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اعلان‌ها | تخصص‌یاب</title>
<meta name="description" content="تخصص‌یاب — ثبت رایگان آگهی استخدام و رزومه، با انتشار در کانال @JobVacencies">
<meta name="theme-color" content="#F5F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F10" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="اعلان‌ها | تخصص‌یاب"><meta property="og:description" content="تخصص‌یاب — ثبت رایگان آگهی استخدام و رزومه، با انتشار در کانال @JobVacencies"><meta property="og:image" content="https://takhassosyab.ir/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="assets/vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/app.css?v=2610101215">
<script>try{var t=JSON.parse(localStorage.getItem('ty2_theme')||'null');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<script src="assets/data.js?v=2610101215" defer></script><script src="assets/core.js?v=2610101215" defer></script>
</head>
<body>
<main class="nonav"></main>
<script>document.addEventListener('DOMContentLoaded',function(){var TY=window.TY,$=TY.$;

TY.shell({title:'اعلان‌ها', back:true, nav:null, bell:false});
var main=$('main'); if(!TY.requireLogin()) return;
var tab=TY.qs('tab')==='inbox'?'inbox':'n';
var KIND={match:['star','brand'],published:['megaphone','brand'],approved:['check','brand'],rejected:['x','danger'],rejected_item:['x','danger'],resume_direct:['inbox','info'],sent:['send','']};
function draw(me){
  window._ibRedraw=function(){var m=TY.cachedMe();if(m&&m.user)draw(m);};
  var emp=me.user.role==='employer'||(me.inbox||[]).length;
  var pushOn=me.user.tg||window.Android||('Notification' in window&&Notification.permission==='granted');
  var h=(emp?'<div class="seg mb" role="tablist" style="margin-bottom:12px"><button role="tab" data-tab="n" aria-selected="'+(tab==='n')+'">اعلان‌ها</button><button role="tab" data-tab="inbox" aria-selected="'+(tab==='inbox')+'">رزومه‌های دریافتی <span class="num">'+((me.inbox||[]).length?TY.fa(me.inbox.length):'')+'</span></button></div>':'');
  if(!pushOn) h+='<div class="banner info" style="margin-bottom:12px">'+TY.ic('bell','sm')+'<div class="grow"><b>اعلان روی گوشی</b>تلگرام را وصل کن (بهترین راه) یا اعلان مرورگر را فعال کن.<div class="btnrow mt2" style="justify-content:flex-start"><a class="btn primary sm" style="flex:0 0 auto" target="_blank" rel="noopener" href="'+TY.esc(me.user.tgLink)+'">اتصال تلگرام</a><button class="btn outline sm" style="flex:0 0 auto" id="push">اعلان مرورگر</button></div></div></div>';
  if(tab==='n'){
    var ns=me.notifs||[];
    h+=ns.length?'<div class="list">'+ns.map(function(n){var k=KIND[n.kind]||['bell',''];return '<a class="row" href="'+TY.notifUrl(n)+'" style="align-items:flex-start"><span class="tile-ic '+k[1]+'">'+TY.ic(k[0],'sm')+'</span><div class="grow"><div class="t" style="white-space:normal">'+TY.esc(n.title)+'</div><div class="s" style="white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+TY.esc(String(n.body||'').split('\n').filter(Boolean).slice(0,2).join(' · '))+'</div><div class="xs faint mt1">'+TY.ago(n.at)+'</div></div>'+(n.read?'':'<span class="new" style="width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:8px"></span>')+'</a>';}).join('')+'</div>'
      :TY.empty('bell','اعلانی نداری','وقتی آگهی یا رزومه‌ی مرتبطی بیاید یا ارسالت تأیید شود، اینجا خبرت می‌کنیم.');
  } else {
    var ib=me.inbox||[];
    h+=ib.length?'<div class="list">'+ib.map(function(r,i){return '<button class="row" data-r="'+i+'"><span class="avatar brand">'+TY.esc(TY.initial(r.title))+'</span><div class="grow"><div class="t">'+TY.esc(r.title||'رزومه')+'</div><div class="s">برای «'+TY.esc(r.adTitle)+'» · '+TY.ago(r.created)+'</div></div>'+(TY.feat('inboxState')?(r.state?'<span class="badge dotted '+({read:'',contacted:'brand',declined:'danger'}[r.state]||'')+'">'+({read:'دیده شد',contacted:'تماس گرفتم',declined:'رد کردم'}[r.state]||'')+'</span>':'<span class="badge dotted warn">جدید</span>'):TY.ic('fwd','sm chev'))+'</button>';}).join('')+'</div>'
      :TY.empty('inbox','هنوز رزومه‌ای نرسیده','کارجوها می‌توانند از صفحه‌ی آگهی‌ات، رزومه را مستقیم برایت بفرستند.');
  }
  main.innerHTML=h;
  var p=$('#push'); if(p) p.onclick=function(){TY.enablePush().then(function(){draw(me);});};
  main.onclick=function(e){var t=e.target.closest('[data-tab]'); if(t){tab=t.getAttribute('data-tab');draw(me);return;}
    var r=e.target.closest('[data-r]'); if(r){openCv(me.inbox[+r.getAttribute('data-r')]);}};
  var want=TY.qs('id'); if(want&&tab==='inbox'){var x=(me.inbox||[]).filter(function(r){return String(r.id)===want;})[0]; if(x){openCv(x);} history.replaceState(null,'','inbox.html?tab=inbox');}
}
var STL=[['read','دیدم'],['contacted','تماس گرفتم'],['declined','رد کردم']];
function setState(r,st,after){r.state=st;var m=TY.cachedMe();if(m){(m.inbox||[]).forEach(function(x){if(x.id===r.id)x.state=st;});TY.store.set('me',m);}
  TY.api('inbox_state',{id:r.id,state:st}).catch(function(){});if(after)after();}
function openCv(r){var phone=(TY.en(r.text).match(/(?:\+98|0)9\d{9}/)||[])[0], fs=TY.feat('inboxState');
  var st=fs?'<div class="chips" id="stc" style="margin-bottom:12px">'+STL.map(function(x){return '<button class="chip" data-s="'+x[0]+'" aria-pressed="'+(r.state===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>':'';
  var s=TY.sheet({title:r.title||'رزومه',body:'<div class="xs muted" style="margin-bottom:12px">برای آگهی «'+TY.esc(r.adTitle)+'» · '+TY.ago(r.created)+'</div>'+st+'<div class="posttext">'+TY.richText(r.text)+'</div>',
   footer:(phone?'<a class="btn primary" href="tel:'+phone+'" data-call>'+TY.ic('phone','sm')+'تماس</a>':'')+'<button class="btn outline" onclick="TY.copy(this.dataset.t)" data-t="'+TY.esc(r.text)+'">'+TY.ic('copy','sm')+'کپی متن</button>',
   onClose:function(){if(fs&&window._ibRedraw)window._ibRedraw();}});
  if(fs){ if(!r.state) setState(r,'read');
    s.body.addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(!b)return;var v=b.getAttribute('data-s'),on=r.state!==v;setState(r,on?v:'read');TY.$$('[data-s]',s.body).forEach(function(x){x.setAttribute('aria-pressed',on&&x===b);});});
    var call=s.el.querySelector('[data-call]'); if(call) call.addEventListener('click',function(){if(r.state!=='contacted')setState(r,'contacted');});
  }}
var c=TY.cachedMe(); if(c&&c.user) draw(c); else main.innerHTML=TY.skeleton(3);
TY.me().then(function(r){ if(!r) return; draw(r); if(r.unread){TY.api('notif_read').then(function(){TY.paintBell(0);var m=TY.cachedMe();if(m){m.unread=0;(m.notifs||[]).forEach(function(n){n.read=true;});TY.store.set('me',m);}});} });

});</script>
</body>
</html>
