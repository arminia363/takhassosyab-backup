<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تخصص‌یاب | ثبت آگهی</title>
<style>
body{margin:0;font-family:Tahoma,sans-serif;background:#0f1a24;color:#fff}
.c{width:100%;box-sizing:border-box;padding:28px 14px 40px}
h1{font-size:2em;margin:.2em;text-align:center}p{color:#b8c7d6;text-align:center}
a.b{display:block;margin:12px 0;padding:22px 12px;border-radius:14px;color:#fff;text-decoration:none;font-size:1.35em;font-weight:bold;text-align:center}
.e{background:#229ED9}.m{background:#7b4dd6}.j{background:#12a36b}.s{font-size:.75em;font-weight:normal;opacity:.9;display:block}.t{color:#6cc4f0}
</style></head><body><div class="c">
<h1>تخصص‌یاب</h1><p>ثبت رایگان آگهی استخدام و کارجو</p>
<a class="b e" href="employer.html">ثبت آگهی استخدام</a>
<a class="b j" href="jobseeker.html">ثبت رزومه کارجو</a>

<p><a class="t" href="https://t.me/JobVacencies">@JobVacencies</a></p>
<a class="b e" href="jobs.html">آگهی‌های استخدام</a><a class="b m" href="favorites.html">علاقه‌مندی‌ها</a>
<a class="b j" href="resumes.html">رزومه‌های کارجویان</a>
</div>
<div id="vip" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px">
  <div style="background:#17212b;border-radius:16px;padding:16px;max-width:420px;width:100%">
    <b id="vipTitle">آگهی ویژه</b>
    <p id="vipText"></p>
    <a id="vipLink" class="b e" href="jobs.html">مشاهده</a>
    <button id="vipClose" style="margin-top:8px;background:#334;color:#fff;border:0;border-radius:10px;padding:10px;width:100%">بستن</button>
  </div>
</div>
<script>
(function(){
  var END="https://script.google.com/macros/s/AKfycby-KF2DQ45TzhqLISN5Xcy0_VOd9-UV63HEh6-6GwlLq7bqxPcSibSgB2ddIdsbBFAU/exec?action=list";
  var role="";
  try{var u=JSON.parse(localStorage.getItem("ty_user")||"{}"); role=u.role||localStorage.getItem("ty_role")||"";}catch(e){}
  fetch(END).then(function(r){return r.json()}).then(function(d){
    var rows=(d.items||[]).filter(function(r){return r.deleted!=="بله" && /vip|ویژه/i.test((r.title||"")+" "+(r.text||""));});
    var item=null, href="jobs.html", title="آگهی ویژه", text="";
    var interest=localStorage.getItem("ty_interest")||"";
    if(role.indexOf("کارجو")>=0 || role==="jobseeker"){
      item=rows.filter(function(r){return r.type!=="jobseeker" && (!interest || (r.title+" "+r.text).indexOf(interest)>=0);})[0];
      text=item?"کار مناسب تو احتمالاً این است. برو چک کن: "+(item.title||"آگهی ویژه"):"";
    } else if(role.indexOf("کارفرما")>=0 || role==="employer"){
      item=rows.filter(function(r){return r.type==="jobseeker" && r.public==="بله";})[0];
      href="resumes.html"; title="رزومه ویژه";
      text=item?"یک رزومه ویژه آمده. برو چک کن: "+(item.title||"رزومه"):"";
    }
    if(!item) return;
    document.getElementById("vipTitle").textContent=title;
    document.getElementById("vipText").textContent=text;
    document.getElementById("vipLink").href=href;
    document.getElementById("vip").style.display="flex"; if(window.Android&&Android.notifyUser) Android.notifyUser(title,text);
  }).catch(function(){});
  document.getElementById("vipClose").onclick=function(){document.getElementById("vip").style.display="none";};
})();
</script>
</body></html>
