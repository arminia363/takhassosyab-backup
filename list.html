<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>آگهی‌ها</title>
<style>body{margin:0;background:#0f1720;color:#fff;font-family:Tahoma,sans-serif}.wrap{max-width:640px;margin:0 auto;padding:16px}.card{background:#17212b;border-radius:12px;padding:12px;margin:8px 0}a{color:#8fd0ff}</style></head>
<body><div class="wrap">
<h1>آگهی‌های کارفرما</h1>
<p>این بخش برای همه باز است.</p>
<div id="jobs"></div>
<h1>رزومه‌ها</h1>
<p>فقط رزومه‌ای که صاحبش تأیید کرده اینجا می‌آید.</p>
<div id="cvs"></div>
<p><a href="employer.html">ثبت آگهی</a> · <a href="jobseeker.html">ثبت رزومه</a></p>
</div>
<script>
function cards(rows){
  if(!rows.length) return "<p>موردی نیست.</p>";
  return rows.map(function(r){return "<div class=\"card\"><b>"+(r.title||"آگهی")+"</b><p>"+(r.text||"")+"</p></div>";}).join("");
}
var feed=[]; try{ feed=JSON.parse(localStorage.getItem("ty_feed")||"[]"); }catch(e){}
document.getElementById("jobs").innerHTML=cards(feed.filter(function(r){return r.type!=="jobseeker";}));
document.getElementById("cvs").innerHTML=cards(feed.filter(function(r){return r.type==="jobseeker" && r.public==="بله";}));
</script></body></html>
