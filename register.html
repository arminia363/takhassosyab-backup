<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تخصص‌یاب</title>
<style>body{margin:0;background:#0f1720;color:#e7edf3;font-family:Tahoma,sans-serif}.wrap{max-width:420px;margin:0 auto;padding:28px 16px;text-align:center}img{width:72px;height:72px;border-radius:18px;object-fit:cover}input,button{width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:14px;margin-top:10px}button{background:#229ED9;color:#fff;font-weight:700}</style></head>
<body><div class="wrap"><img src="logo.jpg" alt=""><h1>تخصص‌یاب</h1>
<form id="f"><input id="name" placeholder="نام" required><input id="mobile" placeholder="موبایل" inputmode="numeric" required><button>ادامه</button></form></div>
<script>
var END="https://script.google.com/macros/s/AKfycbw7BQdea5ifmFm1AN-nbxOj9ktW-99QyuH-n9eqqH3JK81oMCRe-gqQYPv5wUqw6x8/exec";
function norm(s){s=(s||"").replace(/[^0-9]/g,"");if(s.indexOf("98")===0)s="0"+s.slice(2);return s}
var saved=localStorage.getItem("ty_mobile")||"";
if(saved) location.replace("index.html");
document.getElementById("f").onsubmit=function(e){
  e.preventDefault();
  var mobile=norm(document.getElementById("mobile").value);
  if(mobile.length<10) return;
  if(localStorage.getItem("ty_mobile")===mobile){ location.replace("index.html"); return; }
  var p={type:"membership",name:document.getElementById("name").value,mobile:mobile,telegram:"",role:"",field:"",city:"",years:"",source:"اپ",hp:""};
  var body=JSON.stringify(p);
  try{ if(navigator.sendBeacon) navigator.sendBeacon(END, new Blob([body],{type:"text/plain;charset=utf-8"})); }catch(err){}
  localStorage.setItem("ty_mobile", mobile);
  localStorage.setItem("ty_user", body);
  setTimeout(function(){ location.replace("index.html"); }, 700);
};
</script></body></html>
