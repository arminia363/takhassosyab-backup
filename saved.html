<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ذخیره‌ها</title>
<style>body{margin:0;background:#0f1720;color:#fff;font-family:Tahoma,sans-serif}.wrap{width:100%;box-sizing:border-box;padding:16px 12px 40px}.card{background:#17212b;border-radius:14px;padding:14px;margin:10px 0;white-space:pre-wrap;line-height:1.7}a{color:#8fd0ff}</style></head>
<body><div class="wrap"><h1>ذخیره‌ها</h1><p>آگهی و رزومه‌ای که ثبت شده، اینجا می‌ماند تا بعداً بررسی شود.</p><div id="box"></div><p><a href="enter.html">بازگشت</a></p></div>
<script>
var rows=[]; try{rows=JSON.parse(localStorage.getItem("ty_saved")||"[]");}catch(e){}
document.getElementById("box").innerHTML=rows.length?rows.map(function(r){return "<div class=\"card\"><b>"+(r.title||"مورد")+"</b><br>"+(r.text||"")+"</div>";}).join(""):"<p>هنوز موردی ذخیره نشده.</p>";
</script></body></html>
